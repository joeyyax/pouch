name: mail

# Local development. Host ports are offset so they don't collide with other
# projects on the same machine: Postgres 5440, Redis 6390, MinIO 9010 and 9011, Meilisearch 7710.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Every checkout's test run opens a pool per test file against this one server.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail
      POSTGRES_DB: mail
    ports:
      - "5440:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail -d mail"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional. Search falls back to Postgres without it.
  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: pouch-development-meili-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7710:7700"
    volumes:
      - meilisearch:/meili_data

  # Creates the bodies bucket and sets its expiry one day above the default retention ceiling, then exits.
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/mail-bodies
        mc ilm rule rm --all --force local/mail-bodies 2>/dev/null || true
        mc ilm rule add --expire-days 366 --prefix bodies/ local/mail-bodies

volumes:
  postgres:
  minio:
  meilisearch:
